<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>grana</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            document.documentElement.dataset.theme = localStorage.getItem('grana.theme') || '';
        </script>
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#183a2c" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <style>
            .boot {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: grid;
                place-content: center;
                justify-items: center;
                gap: 14px;
                background: #183a2c;
                color: #eef5e6;
            }
            .boot img {
                width: 92px;
                height: 92px;
                border-radius: 26px;
                box-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.5);
                animation:
                    boot-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) both,
                    boot-breathe 2.2s 0.8s ease-in-out infinite;
            }
            .boot b {
                font:
                    600 30px/1 'Fraunces Variable',
                    Georgia,
                    serif;
                letter-spacing: -0.03em;
                animation: boot-up 0.7s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .boot i {
                width: 44px;
                height: 3px;
                border-radius: 3px;
                background: linear-gradient(90deg, transparent, #d4f57a, transparent);
                background-size: 200% 100%;
                animation:
                    boot-up 0.6s 0.45s both,
                    boot-bar 1.1s 0.9s linear infinite;
            }
            .boot.out {
                animation: boot-out 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
                pointer-events: none;
            }
            @keyframes boot-in {
                from {
                    opacity: 0;
                    transform: scale(0.6) rotate(-8deg);
                }
            }
            @keyframes boot-up {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
            }
            @keyframes boot-breathe {
                50% {
                    transform: scale(1.04);
                }
            }
            @keyframes boot-bar {
                to {
                    background-position: -200% 0;
                }
            }
            @keyframes boot-out {
                to {
                    opacity: 0;
                    transform: scale(1.04);
                    visibility: hidden;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot * {
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <app-root
            ><div class="boot" aria-label="Carregando grana"><img src="/icon.svg" alt="" /><b>grana</b><i></i></div
        ></app-root>
    </body>
</html>
